[bar]
order = [ "default" ]

    [bar.default]
    border = "hover"
    center = [ "notes", "media", "audio_visualizer", "status" ]
    end = [
        "privacy",
        "tray",
        "notifications",
        "bluetooth",
        "network",
        "volume",
        "battery",
        "clock",
        "control-center",
        "session"
    ]
    margin_ends = 0
    radius = 0
    start = [ "launcher", "clipboard", "widget", "wallpaper", "workspaces" ]
    thickness = 27

[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
warning_threshold = 10

[calendar]
enabled = true

    [calendar.account.personal_icloud]
    name = "weshy"
    provider = "icloud"
    type = "caldav"
    username = "weshford@icloud.com"

[control_center]
sidebar = "full"
sidebar_section = "full"

[location]
address = "Fellbach, Germany"

