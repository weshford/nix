[osd]
orientation = "vertical"

[plugin_settings."noctalia/wallhaven"]
api_key = "tWvL4qylvnM78IhDXbMLQGDvfQCGnvbz"

[plugins]
enabled = [
    "noctalia/screen_recorder",
    "noctalia/notes",
    "wesh/screen-toolkit",
    "alexander/screen-toolkit",
    "aristides/udiskie"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    enabled = false
    kind = "path"
    location = "~/dev/noctalia-plugins/wesh"
    name = "weshhh"

[shell]
font_family = "SF Pro Text"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
telemetry_enabled = true

    [shell.launcher]
    compact = true
    session_search = true

    [shell.panel]
    transparency_mode = "soft"

[theme]
builtin = "Dracula"
mode = "light"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
transition = [ "honeycomb" ]
transition_duration = 3000
transition_on_startup = true

    [wallpaper.default]
    path = "/home/weshy/Pictures/wallpaper/soraroxas.png"

    [wallpaper.last]
    path = "/home/weshy/Pictures/wallpaper/soraroxas.png"

    [wallpaper.monitors.DVI-I-1]
    path = "/home/weshy/Pictures/wallpaper/soraroxas.png"

    [wallpaper.monitors.DVI-I-2]
    path = "/home/weshy/Pictures/wallpaper/soraroxas.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/weshy/Pictures/wallpaper/soraroxas.png"

[widget.audio_visualizer]
bands = 128
color_2 = "tertiary"
show_when_idle = true
width = 202

[widget.battery]
hide_when_plugged = true

[widget.clipboard]
enabled = true

[widget.clock]
format = "{:%H:%M:%S}"

[widget.control-center]
custom_image = "/home/weshy/.nixos/static/icons/syxx.png"

[widget.custom_button_2]
type = "custom_button"

[widget.media]
album_art_only = true
hide_when_no_media = true

[widget.network]
show_label = false

[widget.notes]
type = "noctalia/notes:notes"

[widget.notifications]
hide_when_no_unread = true

[widget.privacy]
hide_inactive = true

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.status]
type = "aristides/udiskie:status"

[widget.tray]
drawer = true
hidden = [ "udiskie" ]

[widget.volume]
show_label = false

[widget.wallpaper]
enabled = false

[widget.widget]
type = "alexander/screen-toolkit:widget"
